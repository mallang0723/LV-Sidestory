<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Side Story · layout QA</title>
<style>
/* Synthetic stand-in for the host drawer: title bar + close, extension root fills the rest. Not the real Lumiverse chrome. */
:root{--lumiverse-bg:#17151f;--lumiverse-bg-elevated:#221f2d;--lumiverse-text:#efeaf6;--lumiverse-text-muted:#b2abc0;--lumiverse-border:rgba(174,148,218,.24);--lumiverse-primary:#9370db}
html,body{margin:0;height:100%;background:#0e0d13;color:#efeaf6;font-family:system-ui,sans-serif}
.host-drawer{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--lumiverse-bg)}
.host-head{flex:none;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 14px;border-bottom:1px solid var(--lumiverse-border);font-size:15px;font-weight:600}
.host-head button{width:44px;height:44px;border:0;background:transparent;color:inherit;font-size:18px}
#root{flex:1;min-height:0}
</style>
<body><div class="host-drawer"><div class="host-head" data-qa="host-head"><span>Side Story (사이드 스토리)</span><button type="button" aria-label="닫기">✕</button></div><div id="root"></div></div><pre id="qa-result" hidden>RUNNING</pre><script type="module" src="./layout.js"></script></body></html>
